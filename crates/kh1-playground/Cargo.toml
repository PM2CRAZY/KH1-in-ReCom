[package]
name = "kh1-playground"
description = "Bevy demo of the KH1 FM battle-system rewrite: a mannequin Sora posed by his real skeleton and motions, KH1's 60 Hz controller and Attack combo against training dummies. Every number and motion is read from the player's own install; no game meshes, textures or sounds."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "kh1-playground"
path = "src/main.rs"

[dependencies]
kh1-core = { path = "../kh1-core" }
kh1-data = { path = "../kh1-data" }
kh1-anim = { path = "../kh1-anim" }
kh1-formats = { path = "../kh1-formats" }
kh1-trace = { path = "../kh1-trace" }
bevy = { version = "=0.15.3", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd",
    "x11",
] }

# Gamepad support. On Linux it needs libudev-dev; enable it there with `--features gamepad`.
[target.'cfg(not(target_os = "linux"))'.dependencies]
bevy = { version = "=0.15.3", default-features = false, features = ["bevy_gilrs"] }

[features]
gamepad = ["bevy/bevy_gilrs"]
