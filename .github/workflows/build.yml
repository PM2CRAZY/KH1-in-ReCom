# Build bot: on every push to `testing`, run the tests, build the Windows DLL (MinGW, the same
# toolchain as tools/build-win.sh) and commit it to openkh/kh1-recom.dll on `testing`.
name: build
on:
  push:
    branches: [testing]
    paths-ignore: ["openkh/kh1-recom.dll"]
permissions:
  contents: write
concurrency:
  group: build-testing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0
      - name: Toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Tests
        run: cargo test --workspace --exclude kh1-playground
      - name: Build DLL (Windows)
        run: ./tools/build-win.sh
      - name: Commit DLL
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add openkh/kh1-recom.dll
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "build: kh1-recom.dll $(cat VERSION) [skip ci]"
          git checkout -- . && git pull --rebase origin testing
          git push origin HEAD:testing
